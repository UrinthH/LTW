name: Android CI

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Test the shader cache
      run: |
        gcc -Wall -Wextra -fsanitize=address,undefined -g -I ltw/src/main/tinywrapper \
          ltw/src/test/native/shader_cache_test.c ltw/src/main/tinywrapper/shader_cache.c \
          -lpthread -o /tmp/shader_cache_test
        /tmp/shader_cache_test
        gcc -Wall -Wextra -fsanitize=address,undefined -g -I ltw/src/main/tinywrapper \
          ltw/src/test/native/ltw_stats_test.c ltw/src/main/tinywrapper/ltw_stats.c \
          -lpthread -o /tmp/ltw_stats_test
        /tmp/ltw_stats_test
        gcc -Wall -Wextra -fsanitize=address,undefined -g -I ltw/src/main/tinywrapper \
          ltw/src/test/native/shader_dump_test.c ltw/src/main/tinywrapper/shader_dump.c \
          -lpthread -o /tmp/shader_dump_test
        /tmp/shader_dump_test
        gcc -Wall -Wextra -fsanitize=address,undefined -g -I ltw/src/main/tinywrapper \
          ltw/src/test/native/frame_pacing_test.c ltw/src/main/tinywrapper/frame_pacing.c \
          -o /tmp/frame_pacing_test
        /tmp/frame_pacing_test
    - name: Build with Gradle
      run: ./gradlew :ltw:assembleRelease
    - name: Upload AAR
      uses: actions/upload-artifact@v4.6.0
      with:
         name: output-aar
         path: ltw/build/outputs/aar/ltw-release.aar
         if-no-files-found: error
       
